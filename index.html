<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f6f6f6"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>Fake WeChat Studio</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#191919;background:#ededed}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer;border:0;background:none;color:inherit}#app{height:100dvh;max-width:550px;margin:auto;background:#fff;display:flex;flex-direction:column;overflow:hidden}.status{height:env(safe-area-inset-top,12px);min-height:16px;background:#f6f6f6}.header{height:51px;background:#f6f6f6;display:flex;align-items:center;padding:0 16px;gap:14px;border-bottom:1px solid #e9e9e9}.header strong{font-size:17px;flex:1;text-align:center;font-weight:600}.header .side{min-width:45px;font-size:23px}.header .side:first-child{text-align:left}.header .side:last-child{text-align:right}.screen{flex:1;overflow-y:auto;background:#fff}.nav{display:flex;height:60px;padding-bottom:env(safe-area-inset-bottom,0px);background:#fafafa;border-top:1px solid #ddd}.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#777;font-size:11px}.nav button.active{color:#07b75a}.nav .ico{font-size:24px;line-height:1}.search{margin:9px 10px;padding:9px;text-align:center;background:#ededed;color:#999;border-radius:9px;font-size:14px}.item{display:flex;align-items:center;gap:12px;padding:12px 15px;border-bottom:1px solid #f1f1f1;min-height:72px}.avatar{width:49px;height:49px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:23px;color:white;flex-shrink:0;background:#6e9e91;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.item .main{flex:1;min-width:0}.item .name{font-size:16px;font-weight:500}.item .preview{font-size:13px;color:#999;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.time{font-size:11px;color:#aaa;align-self:flex-start;margin-top:5px}.empty{padding:45px 25px;text-align:center;color:#999;font-size:14px}.chatbg{background:#ededed}.bubble-row{display:flex;gap:9px;align-items:flex-start;padding:9px 13px}.bubble-row.mine{flex-direction:row-reverse}.bubble{max-width:75%;border-radius:5px;background:white;padding:10px 12px;font-size:16px;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere;position:relative}.mine .bubble{background:#95ec69}.bubble-row .avatar{width:39px;height:39px;font-size:18px}.msgtime{text-align:center;color:#aaa;font-size:11px;padding:12px}.composer{background:#f7f7f7;border-top:1px solid #ddd;padding:9px;display:flex;gap:7px;align-items:center}.composer input{flex:1;min-width:0;border:0;background:white;padding:10px;border-radius:6px;outline:none}.green{background:#07b75a;color:white;border-radius:6px;padding:10px 13px;font-size:14px}.outline{border:1px solid #ddd;border-radius:7px;padding:10px 12px;background:white}.toolbar{display:flex;align-items:center;gap:8px;padding:8px;background:#f7f7f7;border-top:1px solid #ddd;font-size:12px}.toolbar select{flex:1;min-width:0;border:1px solid #ddd;border-radius:5px;padding:7px;background:white}.section{background:#ededed;padding:8px 15px;color:#777;font-size:13px}.discover{display:flex;gap:14px;align-items:center;padding:17px;border-bottom:1px solid #eee}.discover .symbol{color:#07b75a;font-size:24px}.profile{display:flex;gap:18px;align-items:center;padding:38px 20px;background:white}.profile .avatar{height:65px;width:65px}.profile small{color:#999}.moment-cover{height:210px;background:linear-gradient(135deg,#364e5b,#7d9b86);position:relative}.moment-cover .caption{position:absolute;bottom:15px;right:80px;color:white;font-weight:600}.moment-profile{position:absolute;bottom:-22px;right:15px;border:3px solid white}.post{display:flex;gap:12px;padding:17px 14px;border-bottom:1px solid #eee}.post .avatar{width:42px;height:42px}.postbody{flex:1;min-width:0}.postname{color:#576b95;font-weight:600}.posttext{white-space:pre-wrap;line-height:1.5;margin:7px 0}.postfooter{display:flex;justify-content:space-between;color:#aaa;font-size:12px;margin:10px 0}.reactions{background:#f4f4f4;padding:9px;font-size:13px;line-height:1.7}.link{color:#576b95}.modal-back{position:fixed;inset:0;background:#0007;display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}.modal{background:white;border-radius:12px;padding:20px;width:min(100%,430px);max-height:85dvh;overflow:auto}.modal h3{margin:0 0 15px}.modal label{display:block;margin:12px 0 5px;font-size:13px;color:#666}.modal input,.modal textarea,.modal select{width:100%;padding:11px;border:1px solid #ddd;border-radius:6px;outline-color:#07b75a}.modal textarea{min-height:85px;resize:vertical}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}.hint{font-size:12px;color:#888;line-height:1.5}.settings{padding:15px;display:grid;gap:12px}.settings button{text-align:left;background:#f7f7f7;padding:15px;border-radius:8px}.tag{font-size:11px;color:#999}.contact-select{display:flex;align-items:center;gap:9px;padding:7px 0}.contact-select input{width:auto}.hidden{display:none!important}
</style></head><body><div id="app"></div><input type="file" id="restore" accept="application/json" hidden><script>
const KEY='fake-wechat-studio-v1';const seed={me:{id:'me',name:'Tôi',wechat:'wx_my_story',color:'#7b9d9d',avatar:''},contacts:[{id:'c1',name:'Lâm Tri Hạ',wechat:'linxia',color:'#9d8bba',avatar:''},{id:'c2',name:'Khương Dư Ninh',wechat:'yunin',color:'#c38b83',avatar:''}],chats:[{id:'ch1',members:['c1'],messages:[{id:'m1',sender:'c1',text:'Cậu về đến nhà chưa?',time:'20:16'},{id:'m2',sender:'me',text:'Vừa về rồi.',time:'20:17'}]}],posts:[]};let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch(e){db=structuredClone(seed)}let page='chats',chatId=null,momentMode=false,modal=null,search='';const app=document.querySelector('#app');function save(){localStorage.setItem(KEY,JSON.stringify(db))}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function person(id){return id==='me'?db.me:db.contacts.find(x=>x.id===id)||{id,name:'Không rõ',color:'#888'}}function av(p,extra=''){return `<div class="avatar ${extra}" style="background:${esc(p.color||'#799')}" >${p.avatar?`<img src="${esc(p.avatar)}">`:esc((p.name||'?').slice(0,1))}</div>`}function chatName(c){return c.members.map(id=>person(id).name).join(', ')}function header(title,left='',right=''){return `<div class="status"></div><div class="header"><button class="side" onclick="${left||'goBack()'}">${left?'‹':''}</button><strong>${esc(title)}</strong><button class="side" onclick="${right||'openMenu()'}">${right?'⋯':'⊕'}</button></div>`}function nav(){return `<div class="nav">${[['chats','▤','WeChat'],['contacts','♙','Danh bạ'],['discover','◉','Khám phá'],['me','♙','Tôi']].map(([p,i,n])=>`<button class="${page===p?'active':''}" onclick="page='${p}';chatId=null;momentMode=false;render()"><span class="ico">${i}</span>${n}</button>`).join('')}</div>`}function render(){let s='';if(chatId){const c=db.chats.find(x=>x.id===chatId);if(!c){chatId=null;return render()}s=header(chatName(c),'goBack()','editChat()')+`<div class="screen chatbg" id="messages">${c.messages.map(m=>`<div class="msgtime">${esc(m.time||'')}</div><div class="bubble-row ${m.sender==='me'?'mine':''}" onclick="editMessage('${m.id}')">${av(person(m.sender))}<div class="bubble">${esc(m.text)}</div></div>`).join('')}</div><div class="toolbar"><span>Người gửi</span><select id="sender"><option value="me">${esc(db.me.name)} (tôi)</option>${c.members.map(id=>`<option value="${esc(id)}">${esc(person(id).name)}</option>`).join('')}</select><button class="outline" onclick="addTimedMessage()">🕒</button></div><div class="composer"><input id="messageInput" placeholder="Nhập tin nhắn..." onkeydown="if(event.key==='Enter')sendMessage()"><button class="green" onclick="sendMessage()">Gửi</button></div>`}else if(momentMode){s=header('Vòng bạn bè','closeMoments()','newPost()')+`<div class="screen"><div class="moment-cover"><span class="caption">${esc(db.me.name)}</span>${av(db.me,'moment-profile')}</div><div style="height:33px"></div>${db.posts.map(p=>`<div class="post">${av(person(p.author))}<div class="postbody"><div class="postname">${esc(person(p.author).name)}</div><div class="posttext">${esc(p.text)}</div><div class="postfooter"><span>${esc(p.time)}</span><button onclick="editPost('${p.id}')">•••</button></div>${p.likes.length||p.comments.length?`<div class="reactions">${p.likes.length?`<div>♥ <span class="link">${p.likes.map(id=>esc(person(id).name)).join(', ')}</span></div>`:''}${p.comments.map(q=>`<div><span class="link">${esc(person(q.author).name)}</span>: ${esc(q.text)}</div>`).join('')}</div>`:''}<button class="tag" onclick="reactPost('${p.id}')">+ Thích / Bình luận</button></div></div>`).join('')||'<div class="empty">Chưa có bài đăng. Nhấn ⋯ để tạo Khoảnh khắc đầu tiên.</div>'}</div>`}else{if(page==='chats'){s=header('WeChat')+`<div class="screen"><div class="search">⌕ Tìm kiếm</div>${db.chats.map(c=>{let m=c.messages.at(-1);return `<div class="item" onclick="chatId='${c.id}';render()">${av(person(c.members[0]))}<div class="main"><div class="name">${esc(chatName(c))}</div><div class="preview">${m?esc(m.text):'Chưa có tin nhắn'}</div></div><div class="time">${m?esc(m.time):''}</div></div>`}).join('')||'<div class="empty">Chưa có hội thoại</div>'}</div>`}if(page==='contacts'){s=header('Danh bạ')+`<div class="screen"><div class="discover" onclick="newContact()"><span class="symbol">✚</span>Thêm bạn bè</div><div class="section">DANH BẠ</div>${db.contacts.map(p=>`<div class="item" onclick="contactActions('${p.id}')">${av(p)}<div class="main"><div class="name">${esc(p.name)}</div><div class="preview">WeChat ID: ${esc(p.wechat||'')}</div></div>›</div>`).join('')}</div>`}if(page==='discover'){s=header('Khám phá')+`<div class="screen"><div class="discover" onclick="momentMode=true;render()"><span class="symbol">◈</span>Vòng bạn bè <span style="margin-left:auto">›</span></div><div class="section"></div><div class="discover"><span class="symbol">▦</span>Quét mã QR <span style="margin-left:auto;color:#aaa;font-size:12px">Mô phỏng</span></div><div class="discover"><span class="symbol">◉</span>Lắc <span style="margin-left:auto;color:#aaa;font-size:12px">Mô phỏng</span></div></div>`}if(page==='me'){s=header('Tôi')+`<div class="screen" style="background:#ededed"><div class="profile" onclick="editMe()">${av(db.me)}<div><strong>${esc(db.me.name)}</strong><p><small>WeChat ID: ${esc(db.me.wechat)}</small></p></div><span style="margin-left:auto">›</span></div><div class="settings"><button onclick="editMe()">✎ Chỉnh sửa hồ sơ</button><button onclick="backup()">⇩ Xuất bản sao lưu JSON</button><button onclick="document.querySelector('#restore').click()">⇧ Nhập bản sao lưu JSON</button><button onclick="if(confirm('Xóa toàn bộ dữ liệu trên thiết bị?')){db=structuredClone(seed);save();render()}">Xóa dữ liệu và đặt lại</button><p class="hint">Dữ liệu được lưu trên trình duyệt này. Hãy xuất bản sao lưu thường xuyên để tránh mất truyện khi xóa dữ liệu Safari.</p></div></div>`}s+=nav()}app.innerHTML=s+(modal||'');if(chatId){let el=document.querySelector('#messages');el.scrollTop=el.scrollHeight}}function goBack(){chatId=null;render()}function closeMoments(){momentMode=false;render()}function openMenu(){if(page==='chats')newChat();else if(page==='contacts')newContact();else if(page==='discover'){momentMode=true;render()}else editMe()}function dialog(title,fields,onSave,extra=''){let html=`<div class="modal-back"><div class="modal"><h3>${esc(title)}</h3><form id="dialogForm">${fields}${extra}<div class="actions"><button type="button" class="outline" onclick="modal=null;render()">Hủy</button><button class="green" type="submit">Lưu</button></div></form></div></div>`;modal=html;render();document.querySelector('#dialogForm').onsubmit=e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));onSave(data);modal=null;save();render()}}function field(name,label,value='',type='text'){return `<label>${esc(label)}</label><input name="${name}" type="${type}" value="${esc(value)}" ${type==='text'?'required':''}>`}function area(name,label,value=''){return `<label>${esc(label)}</label><textarea name="${name}" required>${esc(value)}</textarea>`}function newContact(p){dialog(p?'Sửa nhân vật':'Tạo nhân vật',field('name','Tên hiển thị',p?.name)+field('wechat','WeChat ID',p?.wechat||'')+field('color','Màu avatar (mã HEX)',p?.color||'#8d9eb3')+`<label>Ảnh đại diện (tùy chọn, tải ảnh sau khi tạo)</label><button type="button" class="outline" onclick="document.querySelector('#avatarUpload').click()">Chọn ảnh</button><input id="avatarUpload" type="file" accept="image/*" style="display:none" onchange="previewAvatar(this)"><input type="hidden" name="avatar" id="avatarData" value="${esc(p?.avatar||'')}"><p id="avatarHint" class="hint"></p>`,d=>{if(p)Object.assign(p,d);else db.contacts.push({id:uid(),...d})})}function previewAvatar(input){const file=input.files[0];if(!file)return;if(file.size>2e6){alert('Chọn ảnh dưới 2MB để tránh đầy bộ nhớ.');return}let r=new FileReader();r.onload=()=>{document.querySelector('#avatarData').value=r.result;document.querySelector('#avatarHint').textContent='Đã chọn ảnh: '+file.name};r.readAsDataURL(file)}function uid(){return 'id'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}function contactActions(id){let p=person(id);dialog(p.name,`<p class="hint">Chọn thao tác:</p><button type="button" class="outline" onclick="modal=null;newContact(db.contacts.find(x=>x.id==='${id}'))">Sửa hồ sơ</button> <button type="button" class="outline" onclick="startChat('${id}')">Nhắn tin</button>`,()=>{})}function startChat(id){let c=db.chats.find(c=>c.members.length===1&&c.members[0]===id);if(!c){c={id:uid(),members:[id],messages:[]};db.chats.unshift(c)}chatId=c.id;modal=null;save();render()}function newChat(){if(!db.contacts.length){alert('Hãy tạo nhân vật trong Danh bạ trước.');return}dialog('Tạo cuộc trò chuyện',`<p class="hint">Chọn một hoặc nhiều nhân vật (nhiều người sẽ tạo nhóm chat).</p>${db.contacts.map(p=>`<label class="contact-select"><input type="checkbox" name="member" value="${p.id}">${esc(p.name)}</label>`).join('')}`,()=>{},'');let form=document.querySelector('#dialogForm');form.onsubmit=e=>{e.preventDefault();let members=[...form.querySelectorAll('[name=member]:checked')].map(x=>x.value);if(!members.length)return alert('Chọn ít nhất một nhân vật');let c={id:uid(),members,messages:[]};db.chats.unshift(c);chatId=c.id;modal=null;save();render()}}function sendMessage(){let input=document.querySelector('#messageInput'),sender=document.querySelector('#sender').value;if(!input.value.trim())return;let c=db.chats.find(x=>x.id===chatId);c.messages.push({id:uid(),sender,text:input.value.trim(),time:new Date().toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'})});save();render();document.querySelector('#messageInput')?.focus()}function addTimedMessage(){dialog('Chèn mốc thời gian',field('time','Giờ hiển thị','08:30'),d=>{db.chats.find(x=>x.id===chatId).messages.push({id:uid(),sender:'me',text:'',time:d.time})})}function editMessage(id){let c=db.chats.find(x=>x.id===chatId),m=c.messages.find(x=>x.id===id);dialog('Chỉnh sửa tin nhắn',area('text','Nội dung',m.text)+field('time','Thời gian',m.time)+`<label>Người gửi</label><select name="sender">${['me',...c.members].map(x=>`<option value="${x}" ${x===m.sender?'selected':''}>${esc(person(x).name)}</option>`).join('')}</select><p><button type="button" class="outline" onclick="deleteMessage('${id}')">Xóa tin nhắn</button></p>`,d=>Object.assign(m,d))}function deleteMessage(id){if(!confirm('Xóa tin nhắn?'))return;db.chats.find(x=>x.id===chatId).messages=db.chats.find(x=>x.id===chatId).messages.filter(x=>x.id!==id);modal=null;save();render()}function editChat(){let c=db.chats.find(x=>x.id===chatId);dialog('Quản lý hội thoại',`<p>${esc(chatName(c))}</p><p class="hint">Chạm vào tin nhắn để sửa hoặc xóa.</p><button type="button" class="outline" onclick="deleteChat()">Xóa hội thoại</button>`,()=>{})}function deleteChat(){if(!confirm('Xóa toàn bộ hội thoại?'))return;db.chats=db.chats.filter(c=>c.id!==chatId);chatId=null;modal=null;save();render()}function editMe(){dialog('Hồ sơ của tôi',field('name','Tên hiển thị',db.me.name)+field('wechat','WeChat ID',db.me.wechat)+field('color','Màu avatar',db.me.color),d=>Object.assign(db.me,d))}function newPost(p){dialog(p?'Sửa Khoảnh khắc':'Đăng Khoảnh khắc',`<label>Người đăng</label><select name="author">${[db.me,...db.contacts].map(x=>`<option value="${x.id}" ${p?.author===x.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select>`+area('text','Nội dung',p?.text||'')+field('time','Thời gian',p?.time||'Vừa xong'),d=>{if(p)Object.assign(p,d);else db.posts.unshift({id:uid(),...d,likes:[],comments:[]})})}function editPost(id){let p=db.posts.find(x=>x.id===id);dialog('Quản lý bài đăng',`<p>${esc(p.text)}</p><button type="button" class="outline" onclick="modal=null;newPost(db.posts.find(x=>x.id==='${id}'))">Sửa bài đăng</button> <button type="button" class="outline" onclick="if(confirm('Xóa bài đăng?')){db.posts=db.posts.filter(x=>x.id!=='${id}');modal=null;save();render()}">Xóa</button>`,()=>{})}function reactPost(id){let p=db.posts.find(x=>x.id===id);dialog('Tương tác bài đăng',`<label>Nhân vật</label><select name="author">${[db.me,...db.contacts].map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select><label>Hành động</label><select name="action"><option value="comment">Bình luận</option><option value="like">Thích</option></select>`+area('text','Bình luận (bỏ qua nếu chọn Thích)','♥'),d=>{if(d.action==='like'){if(!p.likes.includes(d.author))p.likes.push(d.author)}else p.comments.push({author:d.author,text:d.text})})}function backup(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='fake-wechat-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}document.querySelector('#restore').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(!obj.me||!Array.isArray(obj.contacts)||!Array.isArray(obj.chats)||!Array.isArray(obj.posts))throw Error();if(confirm('Thay toàn bộ dữ liệu bằng bản sao lưu này?')){db=obj;save();render()}}catch{alert('Tệp sao lưu không hợp lệ')}e.target.value='' });render();
</script></body></html>

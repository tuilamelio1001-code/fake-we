s');const oldTop=el?.scrollTop??0;const oldHeight=el?.scrollHeight??0;previewMode=!previewMode;render();const next=document.querySelector('#messages');if(next)next.scrollTop=Math.max(0,oldTop+(next.scrollHeight-oldHeight))}function goBack(){chatId=null;previewMode=false;render()}function closeMoments(){momentMode=false;render()}function openMenu(){if(page==='chats')newChat();else if(page==='contacts')newContact();else if(page==='discover'){momentMode=true;render()}else editMe()}function dialog(title,fields,onSave,extra=''){let html=`<div class="modal-back"><div class="modal"><h3>${esc(title)}</h3><form id="dialogForm">${fields}${extra}<div class="actions"><button type="button" class="outline" onclick="modal=null;render()">Hủy</button><button class="green" type="submit">Lưu</button></div></form></div></div>`;modal=html;render();document.querySelector('#dialogForm').onsubmit=e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));onSave(data);modal=null;save();render()}}function field(name,label,value='',type='text'){return `<label>${esc(label)}</label><input name="${name}" type="${type}" value="${esc(value)}" ${type==='text'?'required':''}>`}function area(name,label,value=''){return `<label>${esc(label)}</label><textarea name="${name}" required>${esc(value)}</textarea>`}function newContact(p){dialog(p?'Sửa nhân vật':'Tạo nhân vật',field('name','Tên hiển thị',p?.name)+field('wechat','WeChat ID',p?.wechat||'')+field('color','Màu avatar (mã HEX)',p?.color||'#8d9eb3')+`<label>Ảnh đại diện (tùy chọn, tải ảnh sau khi tạo)</label><button type="button" class="outline" onclick="document.querySelector('#avatarUpload').click()">Chọn ảnh</button><input id="avatarUpload" type="file" accept="image/*" style="display:none" onchange="previewAvatar(this)"><input type="hidden" name="avatar" id="avatarData" value="${esc(p?.avatar||'')}"><p id="avatarHint" class="hint"></p>`,d=>{if(p)Object.assign(p,d);else db.contacts.push({id:uid(),...d})})}function previewAvatar(i
